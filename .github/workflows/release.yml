name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/*

env:
  python_ver: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_ver }}

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: 'plugin.json'
          prop_path: 'Version'

      # Dependencies are already bundled in lib for Windows (cp311). Avoid overriding with Linux builds.

      - name: Create release zip
        run: |
          zip -r Flow.Launcher.Plugin.DataFaker.zip . -x '*.git*'

      - name: Publish
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: 'Flow.Launcher.Plugin.DataFaker.zip'
          tag_name: "v${{steps.version.outputs.prop}}"
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
