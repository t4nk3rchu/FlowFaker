name: Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # e2e tests run the built bundle under Node, the runtime Flow Launcher uses
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: 'plugin.json'
          prop_path: 'Version'

      - name: Install, build and test
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test

      # Asset name must stay the same: the Flow Launcher plugin store downloads it by this name
      - name: Package
        run: zip -r Flow.Launcher.Plugin.FakerJS.zip dist Images plugin.json LICENSE

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'Flow.Launcher.Plugin.FakerJS.zip'
          tag_name: "v${{ steps.version.outputs.prop }}"
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
